<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>KD Avatar</title>
  <defs>
    <!-- Filter to simulate a subtle drop shadow, mimicking the "shadow-xl" class -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feFlood flood-color="rgba(0,0,0,0.3)" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Define a linear gradient that transitions from Blue to Purple (bg-gradient-to-r from-blue-500 to-purple-600) -->
    <linearGradient id="gradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <!-- Starting color (Left) - Blue 500 (~#3b82f6) -->
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <!-- Ending color (Right) - Purple 600 (~#9333ea) -->
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- The main circle shape with the new gradient and shadow applied -->
  <circle cx="100" cy="100" r="100" fill="url(#gradient)"/>

  <!-- The initials "KD" (text-4xl font-bold text-white) -->
  <text x="100" y="110"
        font-family="sans-serif"
        font-size="80"
        font-weight="700"
        fill="white"
        text-anchor="middle"
        dominant-baseline="middle">
    KD
  </text>
</svg>